name: Node.js CI Template

description: |
  Standard Node.js continuous integration workflow with linting and tests.
  Use this template for fast Node.js project setup.

inputs:
  node-version:
    description: Node.js version to use
    default: '20.x'

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run Tests
      run: npm test
